name: meTTle CI/CD

on:
  push:
    branches: [main, develop, chatbot]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Check Formatting
        run: npx prettier --check "**/*.{js,ts,jsx,tsx,json,md,yml,yaml}" --ignore-path .prettierignore

  unit-tests:
    name: 🧪 Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Run Server Tests
        run: npm test --prefix server

      - name: Run Client Tests
        run: npm test --prefix client -- --watchAll=false

      - name: Upload Server Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

      - name: Upload Client Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 7

  e2e-tests:
    name: 🎭 E2E Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client Dependencies
        run: npm install --prefix client

      - name: Install Server Dependencies
        run: npm install --prefix server

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker Compose
        run: |
          docker-compose up -d --build
          echo "Waiting for services to be ready..."

      - name: Wait for Services
        run: |
          npm install -g wait-on
          wait-on http://localhost:3000 http://localhost:5000 -t 120000 || (docker-compose logs && exit 1)

      - name: Run E2E Tests
        run: npx playwright test --project=chromium

      - name: Stop Docker Compose
        if: always()
        run: docker-compose down

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
